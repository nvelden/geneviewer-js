name: CI

on:
  push:
    branches: [main, "m*-*"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm run check
      - run: npm run types:src
      - run: npm run schema:check
      - run: npm run spec:check
      - run: npm run test:compile
      - run: npm run build
      - run: npm run types:test

  # The package as users install it (test/smoke/run.mjs): a plain page, a
  # Vite project and the types, from an npm pack tarball
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm run test:smoke
        env:
          CHROME_PATH: /usr/bin/google-chrome

  # Fixture and interaction tests in the Docker test image. The image runs
  # natively on arm64 (see docker/Dockerfile), hence the arm64 runner.
  test:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
