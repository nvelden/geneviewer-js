name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run check
      - run: npm run schema:check
      - run: npm run spec:check
      - run: npm run test:compile
      - run: npm run build
      - run: npm run types:test

  # The package as users install it (test/smoke/run.mjs): a plain page, a
  # Vite project and the types, from an npm pack tarball
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run test:smoke
        env:
          CHROME_PATH: /usr/bin/google-chrome
