name: Publish

# Pushing a tag such as v0.3.0 tests and builds the package, publishes it to
# npm with provenance (trusted publishing: no stored token), and makes a
# GitHub release with dist/ attached. A version with a hyphen (0.3.1-beta.1)
# goes to npm's "next" tag and is a GitHub prerelease.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    # npm test runs in the arm64 Docker test image (docker/Dockerfile)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Check the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi
      # npm 11.5 or later publishes with trusted publishing (OIDC)
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: cd dist && sha256sum -c SHA256SUMS
      # A version published by hand (the first one, before the trusted
      # publisher could be added) is not published again; the release still is
      - name: Publish to npm
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "geneviewer@${version}" version > /dev/null 2>&1; then
            echo "geneviewer ${version} is already on npm; not publishing it again"
            exit 0
          fi
          tag=latest
          case "${GITHUB_REF_NAME}" in *-*) tag=next ;; esac
          npm publish --provenance --access public --tag "$tag"
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "${GITHUB_REF_NAME}" in *-*) prerelease="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" $prerelease \
            --title "${GITHUB_REF_NAME}" \
            --notes "geneviewer ${GITHUB_REF_NAME#v}: npm install geneviewer@${GITHUB_REF_NAME#v}. Verify downloads with SHA256SUMS." \
            dist/*
