<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>geneviewer fixture harness</title>
  <link rel="stylesheet" href="../../dist/styles.css">
  <!-- The chart starts 50px in, so the pointer, which starts at 0,0, is not over
       it: a mouse event there would show the trackMouse tooltip at random. -->
  <!-- No CSS transitions (label fade on hover), so styles read in events
       and listings do not depend on timing. -->
  <style>
    body { margin: 0; padding: 50px; }
    #chart { width: 1000px; }
    *, *::before, *::after { transition: none !important; }
  </style>
  <script src="../../vendor/d3-7.8.5/d3.min.js"></script>
  <script src="../../dist/geneviewer.js"></script>
  <script src="htmlwidgets-shim.js"></script>
  <script src="../../dist/geneviewerwidget.js"></script>
  <script src="normalize.js"></script>
  <script src="mount.js"></script>
</head>
<body>
  <div id="chart"></div>
</body>
</html>
